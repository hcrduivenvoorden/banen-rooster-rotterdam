name: Zwemrooster naar ICS

on:
  schedule:
    - cron: "0 4 * * 1"   # elke maandag 04:00 UTC (06:00 NL zomertijd)
  workflow_dispatch:       # handmatig te starten

permissions:
  contents: write

concurrency:
  group: rooster
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - run: python zwemrooster.py

      - name: Commit als er iets gewijzigd is
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add banenzwemmen.ics banenzwemmen-overig.ics
          git diff --staged --quiet && echo "Niets gewijzigd" && exit 0
          git commit -m "Rooster bijgewerkt $(date -u +%F)"
          git pull --rebase origin main
          git push
