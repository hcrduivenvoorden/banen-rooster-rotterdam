name: Zwemrooster naar ICS

on:
  schedule:
    - cron: "0 4 * * 1"   # elke maandag 04:00 UTC (06:00 NL zomertijd)
    - cron: "0 4 * * 0"   # en elke zondag, voor de zekerheid
  workflow_dispatch:       # handmatig te starten

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Het rooster wordt door JavaScript ingeladen, dus de pagina moet
      # in een echte browser gerenderd worden. Vandaar Playwright.
      - run: pip install playwright beautifulsoup4

      - run: python -m playwright install --with-deps chromium

      - run: python zwemrooster.py --debug

      - name: Debug-dump maken als het misgaat
        if: failure()
        run: python zwemrooster.py --debug --dump || true

      - name: Debug-dump uploaden als het misgaat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rooster-debug
          path: rooster_debug.txt
          if-no-files-found: ignore

      - name: Commit als er iets gewijzigd is
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add banenzwemmen.ics
          git diff --staged --quiet || git commit -m "Rooster bijgewerkt $(date -u +%F)"
          git push
